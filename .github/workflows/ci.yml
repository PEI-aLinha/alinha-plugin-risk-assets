# Tests THIS plugin inside the main repo (which has the core and the other plugins) and sends the analysis
# and coverage to this repo's SonarCloud project. The steps live in the main repo:
# PEI-aLinha/alinha/.github/workflows/plugin-ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # SonarCloud PR decoration

jobs:
  ci:
    uses: PEI-aLinha/alinha/.github/workflows/plugin-ci.yml@main
    with:
      plugin-path: plugins/feature/risk-assets
      gradle-project: risk-assets
      npm-package: "@alinha/plugin-risk-assets"
    secrets:
      ALINHA_READ_TOKEN: ${{ secrets.ALINHA_READ_TOKEN }}   # private repos only
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
